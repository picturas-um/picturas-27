<text x="75" y="768" font-family="DejaVu Sans" font-size="10.5" fill="#374151">O orquestrador regista todos os Process antes do passo 7 e envia a pipeline inteira numa única mensagem.</text>
<text x="75" y="788" font-family="DejaVu Sans" font-size="10.5" fill="#374151">O worker decodifica uma vez, aplica os efeitos nos fotogramas e codifica uma só vez; uma falha interrompe todos os domínios.</text>
<text x="75" y="808" font-family="DejaVu Sans" font-size="10.5" fill="#374151">Na variante final, os passos 7–10 passam por três filas e workers, com encadeamento em project_queue.</text>
